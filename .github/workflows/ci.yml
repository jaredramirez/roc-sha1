name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Check, test with every backend, and check formatting
        run: devenv test
      - name: Check speed against the reference implementation (performance regression check)
        # shell: bash adds -o pipefail, so a failing check fails the step
        # even though tee succeeds
        shell: bash
        run: devenv shell just perf-check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare speed with Rust, Go and Python
        # Runner timings are noisy, so this only keeps the comparison
        # programs building and records the numbers in the job summary
        shell: bash
        run: devenv --profile bench shell just bench-compare | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare against coreutils and OpenSSL
        run: devenv shell just diff --count 2000
      - name: Fuzz for 60 seconds
        run: devenv shell just fuzz 60
